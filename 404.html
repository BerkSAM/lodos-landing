<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/lodos-landing/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #17202a; color: #f3f5f7;
    font: 17px/1.5 'Instrument Sans', system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .o { position: relative; width: 96px; height: 96px; margin: 0 auto 28px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #fff, #f3f3f3 50%, #ccc); box-shadow: 0 0 0 1.5px rgba(0,0,0,.35), 0 15px 39px rgba(0,0,0,.35); }
  .o i { position: absolute; top: 45px; width: 16.5px; height: 3.75px; border-radius: 3px; background: #111; }
  .o i:first-child { left: 24px; } .o i:last-child { left: 54px; }
  h1 { font: 700 2rem/1.1 system-ui, sans-serif; letter-spacing: -.03em; margin: 0 0 10px; }
  p { margin: 0 0 24px; color: #cbd2d9; }
  a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #fff; color: #111; font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <div class="o" aria-hidden="true"><i></i><i></i></div>
    <h1>Burada bir şey yok.</h1>
    <p>Rüzgâr bu sayfayı başka yere savurmuş olmalı.</p>
    <a href="/lodos-landing/">Ana sayfaya dön</a>
  </main>
</body>
</html>
